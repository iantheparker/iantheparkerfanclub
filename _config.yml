title: IanTheParker Fan Club
url: https://iantheparker.github.io
baseurl: /iantheparkerfanclub
description: a place for lovers.

collections:
  projects:
    output: true
    permalink: /:name/

exclude:
  - src/
  - node_modules/
  - package.json
  - yarn.lock
  - static.config.js
  - .babelrc
  - .eslintrc.js
  - Gemfile
  - Gemfile.lock

markdown: kramdown
kramdown:
  parse_block_html: true
